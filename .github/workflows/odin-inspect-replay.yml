name: Odin Inspect AI - offline replay calibration

on:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * 1'
  pull_request:
    paths:
      - 'review/inspect_ai/**'
      - '.github/workflows/odin-inspect-replay.yml'

permissions:
  contents: read

concurrency:
  group: odin-inspect-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: '.'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the review fixture without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Inspect AI (no model endpoints)
        run: python -m pip install 'inspect-ai==0.3.279'
      - name: Unit tests and negative controls
        run: python -m unittest discover -s review/inspect_ai -p 'test_*.py' -v
      - name: Render offline calibration report
        run: python review/inspect_ai/run.py --output "$RUNNER_TEMP/odin-calibration.json"
      - name: Native Inspect zero-inference replay
        run: inspect eval review/inspect_ai/inspect_task.py --model none/none --log-dir "$RUNNER_TEMP/odin-inspect-logs"
      - name: Archive read-only calibration proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: odin-inspect-calibration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/odin-calibration.json
            ${{ runner.temp }}/odin-inspect-logs/
          if-no-files-found: warn
          retention-days: 14
