name: Synthetic integration checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tasks/eval-lab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build locked evaluation tools
        run: docker build --tag evaluation-lab-ci:local .
      - name: Run actual tools without networking
        uses: KyPython/ai-governance/.github/actions/system-quality@5dcfb5d6d88a26c7a142b459b83df17cc6b2e590
        with:
          definition: tasks/eval-lab/.quality/system.json
          output-directory: tasks/eval-lab/quality-results/evaluation
      - name: Retain synthetic verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-evaluation
          path: |
            tasks/eval-lab/artifacts/evaluation
            tasks/eval-lab/quality-results/evaluation
          if-no-files-found: error

  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tasks/eval-lab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - name: Install locked browser-test packages without downloading a browser
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --prefix accessibility --ignore-scripts --no-audit --no-fund
      - name: Assert the runner's system Chrome
        run: |
          if [ -x /opt/google/chrome/chrome ]; then
            echo 'PUPPETEER_EXECUTABLE_PATH=/opt/google/chrome/chrome' >> "$GITHUB_ENV"
          elif [ -x /usr/bin/google-chrome ]; then
            echo 'PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome' >> "$GITHUB_ENV"
          else
            echo 'A sandbox-capable preinstalled system Chrome is required.' >&2
            exit 1
          fi
      - name: Run real browser positive and negative controls
        uses: KyPython/ai-governance/.github/actions/system-quality@5dcfb5d6d88a26c7a142b459b83df17cc6b2e590
        with:
          definition: tasks/eval-lab/.quality/accessibility.json
          output-directory: tasks/eval-lab/quality-results/accessibility
      - name: Retain synthetic browser reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-accessibility
          path: |
            tasks/eval-lab/artifacts/browser
            tasks/eval-lab/quality-results/accessibility
          if-no-files-found: error
